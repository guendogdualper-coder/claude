# iPhone/iPad-App „Seelenstein“ bauen (Capacitor-Projekt in ios/)
#
# Job „simulator“ (immer): baut die App für den iOS-Simulator OHNE Signatur – beweist, dass alles kompiliert –
#   und startet sie danach kurz im Simulator (Bildschirmfoto + Protokoll als Artefakt).
# Job „testflight“ (nur wenn die 4 Secrets gesetzt sind): baut die App-Store-Version, signiert sie über Apples
#   Cloud-Signierung mit dem App-Store-Connect-API-Schlüssel und lädt sie zu TestFlight hoch.
#   Buildnummer = Laufnummer dieses Workflows (github.run_number), steigt also automatisch.
#
# Secrets (Repository → Settings → Secrets and variables → Actions → „New repository secret“):
#   APP_STORE_CONNECT_API_KEY_ID   Schlüssel-ID, z. B. 2X9R4HXF34
#   APP_STORE_CONNECT_ISSUER_ID    Issuer-ID (UUID oben auf der Seite „Integrationen“)
#   APP_STORE_CONNECT_API_KEY_P8   Inhalt der .p8-Datei (Text mit BEGIN/END PRIVATE KEY) oder derselbe Inhalt base64-kodiert
#   APPLE_TEAM_ID                  Team-ID (10 Zeichen, Mitgliedschaft im Apple-Developer-Konto)
# Anleitung für alles: docs/ios/anleitung.md
#
# Apple verlangt seit 28. 4. 2026 Builds mit Xcode 26 / iOS-26-SDK oder neuer. Das Runner-Abbild macos-26 hat
# Xcode 26 als Standard; mit der Eingabe „xcode“ lässt sich eine bestimmte Version wählen (z. B. 26.6 oder 27.0).

name: iOS-App

on:
  workflow_dispatch:
    inputs:
      testflight:
        description: 'Nach erfolgreichem Bau zu TestFlight hochladen (nur wenn die Secrets gesetzt sind)'
        type: boolean
        default: true
      version:
        description: 'Versionsnummer im App Store (MARKETING_VERSION), z. B. 1.0.0'
        type: string
        default: '1.0.0'
      xcode:
        description: 'Xcode-Version (leer = Standard des Runners), z. B. 26.6'
        type: string
        default: ''
  push:
    branches:
      - claude/app-entwicklung-hhewbj
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PROJEKT: App/App.xcodeproj
  SCHEMA: App
  BUNDLE_ID: de.seelenstein.spiel

jobs:
  simulator:
    name: Bauen (Simulator, ohne Signatur)
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ios/package-lock.json

      - name: Xcode wählen
        env:
          XCODE_WUNSCH: ${{ inputs.xcode }}
        run: |
          if [ -n "$XCODE_WUNSCH" ]; then
            sudo xcode-select -s "/Applications/Xcode_${XCODE_WUNSCH}.app"
          fi
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          ls -d /Applications/Xcode*.app

      - name: Simulator vorstarten (bootet parallel zum Bauen)
        continue-on-error: true
        run: |
          GERAET=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          kand = [(rt, x) for rt, xs in d.items() if "iOS" in rt for x in xs if x["name"].startswith("iPhone")]
          kand.sort(key=lambda t: t[0])
          print(kand[-1][1]["udid"] if kand else "")
          ')
          echo "Simulator: $GERAET"
          echo "GERAET=$GERAET" >> "$GITHUB_ENV"
          if [ -n "$GERAET" ]; then xcrun simctl boot "$GERAET" || true; fi

      - name: Abhängigkeiten installieren (npm ci)
        run: npm ci

      - name: Capacitor synchronisieren (npx cap sync ios)
        run: npx cap sync ios

      - name: Konfiguration prüfen
        run: |
          plutil -lint App/App/Info.plist App/App/PrivacyInfo.xcprivacy
          test -f App/App/public/offline.html
          test -f App/App/capacitor.config.json
          /usr/libexec/PlistBuddy -c 'Print :WKAppBoundDomains' App/App/Info.plist
          python3 - <<'EOF'
          import json
          c = json.load(open('App/App/capacitor.config.json'))
          print('server.url =', c['server']['url'])
          assert c['appId'] == 'de.seelenstein.spiel'
          EOF
          # App-Symbol: 1024 × 1024 ohne Alphakanal (sonst lehnt App Store Connect den Upload ab)
          sips -g pixelWidth -g pixelHeight -g hasAlpha App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          sips -g hasAlpha App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png | grep -q 'hasAlpha: no'

      - name: Swift-Pakete auflösen
        run: |
          mkdir -p build
          xcodebuild -resolvePackageDependencies -project "$PROJEKT" -scheme "$SCHEMA" -derivedDataPath build/DerivedData 2>&1 | tee build/pakete.log

      - name: Für den Simulator bauen
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJEKT" \
            -scheme "$SCHEMA" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/xcodebuild-simulator.log | grep -E '(error|warning: .*Seelenstein|BUILD SUCCEEDED|BUILD FAILED|\*\*)' || true
          grep -q 'BUILD SUCCEEDED' build/xcodebuild-simulator.log

      - name: Kurztest im Simulator (Start, Bildschirmfoto, Protokoll)
        continue-on-error: true
        timeout-minutes: 20
        run: |
          # Startet die App im Simulator, wartet, macht ein Bildschirmfoto und sammelt die Ausgabe von Capacitor
          # (u. a. „Loading app at https://seelenstein.online/…“, „WebView loaded“, Konsolenmeldungen der Seite).
          # macOS hat kein „timeout“: perl alarm begrenzt hängende simctl-Aufrufe.
          mit_frist() { local s=$1; shift; perl -e 'alarm shift; exec @ARGV' "$s" "$@"; }
          APP=build/DerivedData/Build/Products/Debug-iphonesimulator/App.app
          test -d "$APP"
          test -n "$GERAET"
          mit_frist 900 xcrun simctl bootstatus "$GERAET" -b > build/simulator-boot.log 2>&1 || { tail -n 5 build/simulator-boot.log; exit 1; }
          echo "Simulator gestartet."
          mit_frist 300 xcrun simctl install "$GERAET" "$APP"
          echo "App installiert."
          mit_frist 60 xcrun simctl launch --terminate-running-process \
            --stdout="$PWD/build/app-ausgabe.log" --stderr="$PWD/build/app-ausgabe.log" "$GERAET" "$BUNDLE_ID"
          sleep 60
          mit_frist 90 xcrun simctl io "$GERAET" screenshot --type=png build/simulator-start.png || echo "Bildschirmfoto nicht möglich"
          echo '--- Ausgabe der App (Capacitor) ---'
          grep -a -E 'Loading app|WebView|To Native|Error|error|\[log\]|\[warn\]' build/app-ausgabe.log | head -n 80 || true
          grep -a -q 'WebView loaded' build/app-ausgabe.log && echo "OK: Seite geladen." || echo "::warning::Keine Meldung „WebView loaded“ – Protokoll im Artefakt ansehen."

      - name: Ergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-${{ github.run_number }}
          path: |
            ios/build/*.log
            ios/build/*.png
          if-no-files-found: ignore
          retention-days: 14

  secrets-pruefen:
    name: Secrets für TestFlight vorhanden?
    runs-on: ubuntu-latest
    outputs:
      vorhanden: ${{ steps.pruefen.outputs.vorhanden }}
    steps:
      - id: pruefen
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GEWUENSCHT: ${{ github.event_name != 'workflow_dispatch' || inputs.testflight }}
        run: |
          if [ "$GEWUENSCHT" != "true" ]; then
            echo "TestFlight-Upload wurde beim Start abgewählt – Job „testflight“ wird übersprungen."
            echo "vorhanden=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$KEY_ID" ] && [ -n "$ISSUER_ID" ] && [ -n "$KEY_P8" ] && [ -n "$TEAM_ID" ]; then
            echo "Alle 4 Secrets sind gesetzt – TestFlight-Upload läuft nach dem Simulator-Bau."
            echo "vorhanden=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=TestFlight übersprungen::Nicht alle Secrets gesetzt (APP_STORE_CONNECT_API_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_API_KEY_P8, APPLE_TEAM_ID). Nur der Simulator-Bau läuft. Anleitung: docs/ios/anleitung.md"
            echo "vorhanden=false" >> "$GITHUB_OUTPUT"
          fi

  testflight:
    name: App-Store-Build → TestFlight
    needs: [simulator, secrets-pruefen]
    if: needs.secrets-pruefen.outputs.vorhanden == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    env:
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUILDNUMMER: ${{ github.run_number }}
      VERSION: ${{ inputs.version || '1.0.0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ios/package-lock.json

      - name: Xcode wählen
        env:
          XCODE_WUNSCH: ${{ inputs.xcode }}
        run: |
          if [ -n "$XCODE_WUNSCH" ]; then
            sudo xcode-select -s "/Applications/Xcode_${XCODE_WUNSCH}.app"
          fi
          xcodebuild -version

      - name: Abhängigkeiten und Capacitor
        run: |
          npm ci
          npx cap sync ios

      - name: API-Schlüssel ablegen
        env:
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          KEY_DATEI="$RUNNER_TEMP/asc/AuthKey_${KEY_ID}.p8"
          # Das Secret darf der Text der .p8-Datei sein oder derselbe Text base64-kodiert
          if printf '%s' "$KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$KEY_P8" > "$KEY_DATEI"
          else
            printf '%s' "$KEY_P8" | base64 --decode > "$KEY_DATEI"
          fi
          chmod 600 "$KEY_DATEI"
          grep -q 'BEGIN PRIVATE KEY' "$KEY_DATEI" || { echo "::error::APP_STORE_CONNECT_API_KEY_P8 ist weder eine .p8-Datei noch base64 davon."; exit 1; }
          echo "KEY_DATEI=$KEY_DATEI" >> "$GITHUB_ENV"

      # Seit 13.85: von Hand signieren. Das unsignierte Archiv wurde beim Export nicht mit Apples Cloud-Zertifikat
      # neu signiert (Upload-Fehler 90035 „Invalid Signature“). Darum holt sich der Bau über die API selbst ein
      # „Apple Distribution“-Zertifikat und ein App-Store-Profil (scripts/asc_signatur.py) und legt beides in einen
      # eigenen Schlüsselbund. Beim Erreichen der Höchstzahl zieht das Skript das älteste Vertriebszertifikat zurück.
      - name: Vertriebszertifikat und Profil holen
        run: |
          SIG="$RUNNER_TEMP/sig"
          python3 scripts/asc_signatur.py "$SIG"
          source "$SIG/werte.env"
          KC="$SIG/ci.keychain-db"
          KC_PW="$(uuidgen)"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          if grep -q 'BEGIN RSA PRIVATE KEY' "$SIG/key.pem"; then FORMAT=openssl; else FORMAT=pkcs8; fi
          security import "$SIG/key.pem" -k "$KC" -f "$FORMAT" -t priv -T /usr/bin/codesign -T /usr/bin/security
          security import "$SIG/cert.cer" -k "$KC" -f x509 -T /usr/bin/codesign
          # Apples Zwischenzertifikat (WWDR G3), damit die Kette vollständig ist
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$SIG/wwdr.cer" \
            && security import "$SIG/wwdr.cer" -k "$KC" -f x509 || echo "WWDR-Zwischenzertifikat nicht nachgeladen (meist schon vorhanden)."
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          for D in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$D"
            cp "$SIG/profil.mobileprovision" "$D/$PROFIL_UUID.mobileprovision"
          done
          {
            echo "KC=$KC"
            echo "PROFIL_UUID=$PROFIL_UUID"
            echo "PROFIL_NAME=$PROFIL_NAME"
          } >> "$GITHUB_ENV"

      - name: Projekt auf Hand-Signierung stellen
        run: |
          # Nur das App-Ziel (die Swift-Pakete von Capacitor bleiben unsigniert, sie werden beim Einbetten signiert)
          python3 - <<'PY'
          import os, re
          pfad = 'App/App.xcodeproj/project.pbxproj'
          text = open(pfad).read()
          team, profil = os.environ['TEAM_ID'], os.environ['PROFIL_NAME']
          def anpassen(block):
              if 'PRODUCT_BUNDLE_IDENTIFIER = de.seelenstein.spiel;' not in block.group(0):
                  return block.group(0)
              b = block.group(0).replace('CODE_SIGN_STYLE = Automatic;',
                  'CODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";\n'
                  '\t\t\t\t"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";\n'
                  f'\t\t\t\tDEVELOPMENT_TEAM = {team};\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{profil}";')
              return b
          neu, n = re.subn(r'buildSettings = \{.*?\n\t\t\t\};', anpassen, text, flags=re.S)
          assert 'PROVISIONING_PROFILE_SPECIFIER' in neu, 'App-Ziel nicht gefunden'
          open(pfad, 'w').write(neu)
          print('Hand-Signierung eingetragen.')
          PY

      - name: Archiv bauen (Release, Gerät, signiert)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project "$PROJEKT" \
            -scheme "$SCHEMA" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Seelenstein.xcarchive" \
            -derivedDataPath build/DerivedData \
            OTHER_CODE_SIGN_FLAGS="--keychain $KC" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILDNUMMER" \
            2>&1 | tee build/xcodebuild-archiv.log | grep -E '(error|ARCHIVE SUCCEEDED|ARCHIVE FAILED|\*\*)' || true
          grep -q 'ARCHIVE SUCCEEDED' build/xcodebuild-archiv.log
          APP="$RUNNER_TEMP/Seelenstein.xcarchive/Products/Applications/App.app"
          codesign -dvv "$APP" 2>&1 | grep -E 'Authority|TeamIdentifier' || true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"

      - name: Exportieren und zu TestFlight hochladen
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFIL_NAME}</string>
            </dict>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><false/>
          </dict>
          </plist>
          EOF
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Seelenstein.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$KEY_DATEI" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            2>&1 | tee build/xcodebuild-export.log
          grep -qE 'EXPORT SUCCEEDED|Upload succeeded|Uploaded' build/xcodebuild-export.log
          echo "::notice title=TestFlight::Build ${VERSION} (${BUILDNUMMER}) wurde hochgeladen. Apple verarbeitet ihn jetzt (meist 5–30 Minuten); danach erscheint er in App Store Connect unter TestFlight."

      - name: Schlüssel löschen
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/asc"
          if [ -n "${KC:-}" ]; then security delete-keychain "$KC" || true; fi
          rm -rf "$RUNNER_TEMP/sig"

      - name: Protokolle hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-testflight-${{ github.run_number }}
          path: ios/build/*.log
          if-no-files-found: ignore
          retention-days: 14
